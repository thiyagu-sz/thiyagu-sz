<svg xmlns="http://www.w3.org/2000/svg" width="290" height="140" viewBox="0 0 290 140" role="img" aria-label="Current streak: 3 days in a row">
<title>Current streak: 3 days in a row</title>
<style>

.d { font-family:'Display', Georgia, 'Times New Roman', serif; }
.b { font-family:'Body', -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }

@keyframes fadeUp { from { opacity:0; transform:translateY(10px) } to { opacity:1; transform:none } }
@keyframes fadeIn { from { opacity:0 } to { opacity:1 } }
@keyframes grow   { from { transform:scaleY(0) } to { transform:scaleY(1) } }
@keyframes pop    { from { opacity:0; transform:scale(.4) } to { opacity:1; transform:none } }
@keyframes blink  { 50% { opacity:0 } }
@keyframes draw   { to { stroke-dashoffset:0 } }
.tile { animation: fadeUp .6s ease-out 0.45s both; }
@media (prefers-reduced-motion: reduce) { * { animation:none !important; } }
</style>

<g class="tile">
<rect x="0.5" y="0.5" width="289" height="139" rx="16" fill="#111833" stroke="#1f2a4d"/>
<text class="b" x="24" y="40" font-size="14" fill="#8a95b8" letter-spacing="1.5">CURRENT STREAK</text>
