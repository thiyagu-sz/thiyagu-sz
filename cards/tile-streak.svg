ff" visibility="hidden">3<set attributeName="visibility" to="visible" begin="1.250s" dur="0.050s"/></text><text x="24" y="96" class="d" font-size="48" fill="#e6ebff" visibility="hidden">3<set attributeName="visibility" to="visible" begin="1.300s" dur="0.050s"/></text><text x="24" y="96" class="d" font-size="48" fill="#e6ebff" visibility="hidden">3<set attributeName="visibility" to="visible" begin="1.350s" dur="0.050s"/></text><text x="24" y="96" class="d" font-size="48" fill="#e6ebff" visibility="hidden">3<set attributeName="visibility" to="visible" begin="1.400s" dur="0.050s"/></text><text x="24" y="96" class="d" font-size="48" fill="#e6ebff" visibility="hidden">3<set attributeName="visibility" to="visible" begin="1.450s" dur="0.050s"/></text><text x="24" y="96" class="d" font-size="48" fill="#e6ebff" visibility="hidden">3<set attributeName="visibility" to="visible" begin="1.500s" fill="freeze"/></text>
