<svg xmlns="http://www.w3.org/2000/svg" width="900" height="220" viewBox="0 0 900 220" role="img" aria-label="Contributions per month">
<title>Contributions per month</title>
<style>

.d { font-family:'Display', Georgia, 'Times New Roman', serif; }
.b { font-family:'Body', -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }

@keyframes fadeUp { from { opacity:0; transform:translateY(10px) } to { opacity:1; transform:none } }
@keyframes fadeIn { from { opacity:0 } to { opacity:1 } }
@keyframes grow   { from { transform:scaleY(0) } to { transform:scaleY(1) } }
@keyframes pop    { from { opacity:0; transform:scale(.4) } to { opacity:1; transform:none } }
@keyframes blink  { 50% { opacity:0 } }
@keyframes draw   { to { stroke-dashoffset:0 } }

.title { animation: fadeIn .5s ease-out .2s both; }
.bar { transform-box:fill-box; transform-origin:bottom; animation: grow .7s cubic-bezier(.2,.8,.2,1) both; }
.v   { animation: fadeIn .4s ease-out both; }

@media (prefers-reduced-motion: reduce) { * { animation:none !important; } }
</style>

