name: README cards

on:
  schedule:
    - cron: "30 0 * * *"   # 00:30 UTC = 06:00 IST, daily
  workflow_dispatch:         # "Run workflow" button in the Actions tab
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "fonts/**"
      - ".github/workflows/readme-cards.yml"

permissions:
  contents: write

concurrency:
  group: readme-cards
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Render README cards
        env:
          # The default GITHUB_TOKEN only sees PUBLIC contributions.
          # To include private contributions: create a classic personal access token with the
          # read:user scope, save it as a repository secret named GH_PAT, and change this line to
          #   GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          # (also tick "Include private contributions on my profile" in your GitHub profile settings).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
        run: python scripts/render_cards.py

      - name: Commit updated cards (only if something changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cards data
          if git diff --cached --quiet; then
            echo "Cards unchanged - nothing to commit"
          else
            git commit -m "chore: refresh README cards"
            git pull --rebase --autostash
            git push
          fi
