name: README cards

on:
  schedule:
    - cron: "30 0 * * *"   # daily at 06:00 IST
  workflow_dispatch:         # "Run workflow" button in the Actions tab
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "fonts/**"
      - ".github/workflows/readme-cards.yml"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Render README cards (hero, tiles, graph, monthly)
        env:
          # Default token reads public contributions. To include private ones, create a
          # classic PAT with read:user, save it as secret GH_PAT, and use secrets.GH_PAT here.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
        run: python scripts/render_cards.py

      - name: Commit updated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cards data
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore: refresh README cards"
            git push
          fi
